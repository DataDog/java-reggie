plugins {
    id 'jacoco'
    // Pinned below 8.3.0: 8.4.0's googleJavaFormat worker throws
    // NoClassDefFoundError on com.sun.tools.javac.tree.JCTree$JCAnyPattern
    // when formatting any file that needs reformatting (JDK 11/17/21 tested).
    // Bump only after confirming spotlessApply works on a real file again.
    id 'com.diffplug.spotless' version '8.10.3'
    id 'com.vanniktech.maven.publish' version '0.37.0' apply false
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

project.version = "0.6.0-SNAPSHOT"

repositories {
    mavenCentral()
}

jacoco {
    toolVersion = '0.8.15'
}

allprojects {
    group = 'com.datadoghq'
    version = rootProject.version
}

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl = uri('https://ossrh-staging-api.central.sonatype.com/service/local/')
            snapshotRepositoryUrl = uri('https://central.sonatype.com/repository/maven-snapshots/')
            username = System.getenv('SONATYPE_USERNAME')
            password = System.getenv('SONATYPE_PASSWORD')
        }
    }
}

// Configure Maven Central publishing for all publishable subprojects
subprojects {
    plugins.withId('com.vanniktech.maven.publish') {
        mavenPublishing {
            publishToMavenCentral()
            signAllPublications()

            pom {
                name = project.name
                description = project.description ?: "Part of the Reggie project"
                url = 'https://github.com/DataDog/java-reggie'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'DataDog'
                        name = 'Datadog'
                        email = 'oss@datadoghq.com'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/DataDog/java-reggie.git'
                    developerConnection = 'scm:git:ssh://github.com/DataDog/java-reggie.git'
                    url = 'https://github.com/DataDog/java-reggie'
                }
            }
        }
        def gpgKeyProvider = providers.environmentVariable("GPG_PRIVATE_KEY")
        def gpgPasswordProvider = providers.environmentVariable("GPG_PASSWORD")
        signing {
            useInMemoryPgpKeys(gpgKeyProvider.orNull, gpgPasswordProvider.orNull)
        }
        tasks.withType(Sign).configureEach {
            onlyIf { gpgKeyProvider.isPresent() }
        }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'
    apply plugin: 'com.diffplug.spotless'

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    spotless {
        java {
            target 'src/**/*.java'

            // Use Google Java Format
            googleJavaFormat('1.35.0')

            // Exclude generated sources
            targetExclude 'build/generated/**'

            // Check for Apache 2.0 license header
            licenseHeaderFile rootProject.file('.github/license-header.txt')
        }
    }

    jacoco {
        toolVersion = '0.8.15'
    }

    tasks.withType(Javadoc).configureEach {
        options.addStringOption('Xdoclint:none', '-quiet')
    }

    tasks.named('test') {
        finalizedBy jacocoTestReport
    }

    tasks.named('jacocoTestReport') {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
            csv.required = false
        }
    }

    // Set artifact ID to match project name
    // This ensures artifact IDs match the project name (e.g. reggie-processor).
    tasks.withType(Jar) {
        archiveBaseName = project.name
    }
}

// Aggregate coverage report for all modules (excluding benchmarks and test infrastructure)
tasks.register('jacocoAggregateReport', JacocoReport) {
    group = 'verification'
    description = 'Generates aggregate JaCoCo coverage report'

    dependsOn subprojects*.test

    // Collect execution data from all subprojects except benchmark.
    // Filter to the canonical `test` task: withType(Test) is a live collection, so additional Test
    // tasks (e.g. reggie-runtime:linearFindTest) would be pulled in implicitly and make this task
    // run under `build -x test` (CodeQL), failing Gradle's implicit-dependency validation. The
    // filtered task re-runs the same tests, so its execution data adds nothing to coverage.
    subprojects.each { subproject ->
        if (subproject.name != 'reggie-benchmark') {
            subproject.plugins.withType(JavaPlugin) {
                executionData subproject.tasks.withType(Test).matching { it.name == 'test' }
                sourceSets subproject.sourceSets.main
            }
        }
    }

    // Exclude test data, corpus, debug packages, and standalone debug utilities
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
            '**/testdata/**',
            '**/corpus/**',
            '**/debug/**',
            '**/PatternDebugger.class'
        ])
    }))

    reports {
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/aggregate/jacocoTestReport.xml')
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/aggregate/html')
    }
}

// Coverage verification with module-specific thresholds (excluding benchmarks and test infrastructure)
tasks.register('jacocoVerify', JacocoCoverageVerification) {
    group = 'verification'
    description = 'Verifies code coverage meets minimum thresholds'

    dependsOn subprojects*.test

    violationRules {
        rule {
            limit {
                minimum = 0.70  // 70% overall minimum
            }
        }
        rule {
            limit {
                counter = 'BRANCH'
                minimum = 0.55  // Target: 0.70 — ratchet up as coverage improves
                maximum = 1.0
            }
        }
    }

    // Collect execution data from all subprojects except benchmark.
    // Filter to the canonical `test` task: withType(Test) is a live collection, so additional Test
    // tasks (e.g. reggie-runtime:linearFindTest) would be pulled in implicitly and make this task
    // run under `build -x test` (CodeQL). The filtered task re-runs the same tests, so its
    // execution data adds nothing to coverage.
    def verifyExecData = []
    subprojects.each { subproject ->
        if (subproject.name != 'reggie-benchmark') {
            subproject.plugins.withType(JavaPlugin) {
                // Explicit dependency on the consumed source-set outputs: classDirectories below
                // is built via fileTree(dir: ...), which drops the task dependency and would
                // otherwise fail Gradle's implicit-dependency validation whenever this task runs.
                dependsOn subproject.tasks.named('classes')
                executionData subproject.tasks.withType(Test).matching { it.name == 'test' }
                sourceSets subproject.sourceSets.main
                verifyExecData << subproject.layout.buildDirectory.file('jacoco/test.exec')
            }
        }
    }
    // JacocoCoverageVerification errors out on missing execution data, and its classDirectories
    // (built via fileTree(dir: ...)) carry no task dependency on the source-set outputs — so when
    // this task executes without the test tasks having run (e.g. `build -x test`, the CodeQL
    // build), Gradle fails it either on the implicit dependency or on the missing .exec files.
    // There is nothing to verify without test-run data: skip instead.
    onlyIf {
        verifyExecData.any { it.get().asFile.exists() }
    }

    // Exclude test data, corpus, debug packages, and standalone debug utilities
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
            '**/testdata/**',
            '**/corpus/**',
            '**/debug/**',
            '**/PatternDebugger.class'
        ])
    }))
}

// Wire coverage gate into the standard check lifecycle
check.dependsOn jacocoVerify
