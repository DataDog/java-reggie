plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':reggie-annotations')
    implementation project(':reggie-codegen')

    // ASM for ImplClass generation (minimal - main bytecode generation is in reggie-codegen)
    implementation 'org.ow2.asm:asm:9.10.1'

    // Auto-service for annotation processor registration
    implementation 'com.google.auto.service:auto-service-annotations:1.1.1'
    annotationProcessor 'com.google.auto.service:auto-service:1.1.1'

    testImplementation project(':reggie-runtime')
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Enable annotation processor for test sources
    testAnnotationProcessor project(':reggie-processor')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('graphemeTest', Test) {
    group = 'verification'
    description = 'Runs Java 21 generated grapheme matchers on the selected test JVM'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching 'com.datadoghq.reggie.processor.GraphemeProcessorTest' }
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(providers.gradleProperty('graphemeTestJava').orElse('21').get().toInteger())
    }
}

tasks.register('verifyCoverage', JacocoCoverageVerification) {
    dependsOn tasks.named('test')
    executionData tasks.named('test')
    sourceSets sourceSets.main
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.65  // 65% target for processor
            }
        }
    }
}
